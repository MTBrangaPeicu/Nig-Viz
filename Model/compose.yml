services:
  app:
    build: .
    image: nig-viz/model
    volumes:
      - /data/nig-viz/datasets:/home/appuser/.ir_datasets
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            #device_ids: ['0', '1']
            device_ids: ['1']
            capabilities: [gpu]
